[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-frontend-qa"
version = "0.1.0"
description = "Evidence-driven frontend QA using Jev and Browser Harness"
requires-python = ">=3.12"
dependencies = ["browser-harness==0.1.13", "httpx[http2]>=0.28,<1", "pydantic>=2.10,<3"]

[project.scripts]
jev-qa = "jev_frontend_qa.cli:main"
jev-todo = "jev_frontend_qa.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_frontend_qa"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
